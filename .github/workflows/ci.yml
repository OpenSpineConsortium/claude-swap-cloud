name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A push to a branch under test cancels the run its last push started: only
# the newest head's result matters, and three jobs on a superseded commit
# hold up the runners the newest one is queued behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The browser scripts and the Chrome extension are tested under Node
      # (tests/js, run from pytest); 24 is what the extension suites need.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # uv (not pip) so the PEP 735 dev dependency-group — pytest,
      # pytest-asyncio — installs from the committed lockfile, same as local
      # development.
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  # The zip uploaded to the Chrome Web Store, built and checked on every
  # push and kept as an artifact, so a release uploads bytes CI has seen
  # (docs/store/SUBMISSION.md). Built through the release kit's two
  # actions (release-kit/README.md), the ones release.yml's workflow runs
  # on main, so a pull request that changes the kit exercises it here.
  extension-package:
    runs-on: ubuntu-latest
    env:
      # The packager minifies the scripts with the esbuild installed below
      # (ESBUILD_VERSION in package.mjs); with it named here, under both
      # names, the packager's test and the kit's check that the minified
      # scripts parse and export the same.
      CSWAP_ESBUILD: esbuild
      RELEASE_KIT_ESBUILD: esbuild

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the kit numbers the build by the commit count.
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install esbuild
        run: npm install -g esbuild@0.25.11

      - name: Test the packager and the kit
        run: node --test tests/js/extension/package.test.js "release-kit/tests/*.test.js"

      - name: Build the store zip
        id: kit
        uses: ./release-kit
        with:
          name: cswap-import
          build: node extension/scripts/package.mjs
          zip: extension/.output/cswap-import-*-chrome.zip

      # The store action with no secrets: it says "Not configured" and
      # passes, which proves the wiring and sends nothing.
      - name: The store step, not configured
        uses: ./release-kit/store
        with:
          zip: ${{ steps.kit.outputs.zip }}

      - name: Keep the store zip
        uses: actions/upload-artifact@v4
        with:
          name: cswap-import-chrome
          path: |
            ${{ steps.kit.outputs.dir }}/*.zip
            ${{ steps.kit.outputs.dir }}/*.zip.sha256
          if-no-files-found: error

  test-windows:
    runs-on: windows-latest
    env:
      # The real-browser tests give a DevTools command, a sign-in page or a
      # plain window 15 s instead of a minute, so a browser that never
      # answers fails the job in minutes rather than after eleven tests have
      # each waited out a minute.
      CSWAP_TEST_WAIT: '15'

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      # Branded Chrome on the Windows and macOS runners (154 when this was
      # written) starts but never opens its DevTools port, whatever the flags,
      # so the real-browser tests drive Chrome for Testing, the build made for
      # automation, named through CSWAP_BROWSER as a person would with
      # --browser. The current stable version is looked up first so the
      # download can be cached by version: a cache hit leaves the installer
      # with nothing to fetch (it keeps a build it finds unpacked).
      - name: Find the current Chrome for Testing
        id: cft
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -e 'fetch("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json").then(r => r.json()).then(j => console.log(j.channels.Stable.version))')
          echo "chrome@$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restored here and saved right after the install, not in a post
      # step: actions/cache saves only when the whole job passes, so a red
      # job would download the browser again on every run.
      - name: Restore Chrome for Testing
        id: cft-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cft
          key: chrome-for-testing-${{ runner.os }}-${{ steps.cft.outputs.version }}

      - name: Install Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          # It prints "chrome@<version> <path to the executable>".
          installed=$(npx -y @puppeteer/browsers@2 install "chrome@${{ steps.cft.outputs.version }}" --path "$RUNNER_TEMP/cft" | tail -n 1)
          echo "$installed"
          executable="${installed#* }"
          test -f "$executable"
          echo "CSWAP_BROWSER=$executable" >> "$GITHUB_ENV"

      - name: Save Chrome for Testing
        if: steps.cft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cft
          key: chrome-for-testing-${{ runner.os }}-${{ steps.cft.outputs.version }}

      # The browser and DevTools tests first, on their own: they are the ones
      # that fail on a runner, and a failure there should show in minutes,
      # not after the rest of the suite.
      - name: Run the browser and DevTools tests
        run: uv run pytest tests/test_project_move_auto.py tests/test_cdp.py

      - name: Run the rest of the tests
        # Includes the TUI tests: the Textual TUI (unlike the old curses one)
        # runs on stock Windows, and this job is the proof.
        run: uv run pytest --ignore=tests/test_project_move_auto.py --ignore=tests/test_cdp.py

  # The id stays `macos-keychain` although the job now runs everything: it is
  # the name branch protection matches on, and renaming it silently drops the
  # required check.
  macos-keychain:
    runs-on: macos-latest
    env:
      # As in test-windows: short waits in the real-browser tests.
      CSWAP_TEST_WAIT: '15'

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      # Chrome for Testing, looked up, cached and installed as in test-windows.
      - name: Find the current Chrome for Testing
        id: cft
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -e 'fetch("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json").then(r => r.json()).then(j => console.log(j.channels.Stable.version))')
          echo "chrome@$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Restored here and saved right after the install, not in a post
      # step: actions/cache saves only when the whole job passes, so a red
      # job would download the browser again on every run.
      - name: Restore Chrome for Testing
        id: cft-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cft
          key: chrome-for-testing-${{ runner.os }}-${{ steps.cft.outputs.version }}

      - name: Install Chrome for Testing
        shell: bash
        run: |
          set -euo pipefail
          # It prints "chrome@<version> <path to the executable>".
          installed=$(npx -y @puppeteer/browsers@2 install "chrome@${{ steps.cft.outputs.version }}" --path "$RUNNER_TEMP/cft" | tail -n 1)
          echo "$installed"
          executable="${installed#* }"
          test -f "$executable"
          echo "CSWAP_BROWSER=$executable" >> "$GITHUB_ENV"

      - name: Save Chrome for Testing
        if: steps.cft-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cft
          key: chrome-for-testing-${{ runner.os }}-${{ steps.cft.outputs.version }}

      # The browser and DevTools tests first, on their own, as in
      # test-windows: a failure there shows in minutes. faulthandler as below.
      - name: Run the browser and DevTools tests
        timeout-minutes: 10
        run: uv run pytest -o faulthandler_timeout=600 tests/test_project_move_auto.py tests/test_cdp.py

      - name: Run the rest of the suite (not only the Keychain files)
        # THE NARROW SELECTION WAS A BLIND SPOT, not a saving. Three cases
        # failed on macOS -- one asserting the Linux XDG layout, two because a
        # usable Keychain takes the write and leaves no `.enc` to chmod --
        # while every job stayed green, because this job never ran them. A merge that
        # restores a two-file selection here re-opens that hole invisibly:
        # those cases pass now, they would simply stop running.
        #
        # faulthandler dumps every thread's stack past the budget, the only
        # clue when a `security` call blocks on an invisible SecurityAgent
        # dialog. While pyproject sets no faulthandler keys this `-o` is the
        # only thing setting the budget and the dump does not abort; PR 287
        # adds them repo-wide at the same 600, after which this is a no-op
        # and the dump aborts the worker. `timeout-minutes` is the backstop
        # that holds under either ordering.
        timeout-minutes: 15
        run: uv run pytest -o faulthandler_timeout=600 --ignore=tests/test_project_move_auto.py --ignore=tests/test_cdp.py
