name: Release the extension

# How the extension reaches the Chrome Web Store (docs/store/SUBMISSION.md,
# section 5): the release kit's workflow, release-kit.yml beside this file
# (release-kit/README.md), called with this repository's own build. In
# short:
#   a push to main that changes what the zip holds tests the extension,
#     builds the zip as version <manifest>.<commit count> and keeps it as
#     the GitHub release extension-v<that version>, the repository's
#     latest, with the zip and its SHA-256 attached under the versioned
#     name and under the fixed name claude-swap-cloud-chrome.zip, so the newest
#     build is always at
#     https://github.com/OpenSpineConsortium/claude-swap-cloud/releases/latest/download/claude-swap-cloud-chrome.zip
#     (README.md). Then, when the repository variable CWS_ON_PUSH is
#     `upload`, that same zip goes to the store item as its draft; when it
#     is `publish`, the draft is submitted for review too. Unset or `off`,
#     the release is made and nothing goes to the store.
#   a tag extension-v<version> releases the manifest's exact version the
#     same way and uploads it, whatever CWS_ON_PUSH says.
#   Run workflow, with `upload` and/or `publish` ticked, does the same by
#     hand on any branch or tag; with neither ticked it tests and builds,
#     and keeps the zip as the run's artifact only.
# The five CWS_ secrets gate every store call: without them the store step
# says "Not configured" and the run stays green (section 6). They are
# passed to the kit's workflow by name, and nothing else is.
#
# The zip is this repository's own packager's (extension/scripts/
# package.mjs, with its permission and ASCII rules), built at the
# manifest's version; the kit stamps the build number into its manifest
# (the same bytes `package.mjs --build N` writes), names the release and
# makes it. The kit's two actions are taken from main, so a manual run on
# a branch builds with the kit as it is on main.

on:
  push:
    branches: [main]
    # What package.mjs puts in the zip, the two files that shape it, and
    # the parts of the kit that build and release it (its README, its
    # template and its tests change nothing about a release).
    paths:
      - 'extension/manifest.json'
      - 'extension/sidepanel.html'
      - 'extension/src/**'
      - 'extension/icons/**'
      - 'extension/scripts/package.mjs'
      - 'PRIVACY.md'
      - '.github/workflows/release.yml'
      - '.github/workflows/release-kit.yml'
      - 'release-kit/*.mjs'
      - 'release-kit/action.yml'
      - 'release-kit/store/**'
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the zip to the Chrome Web Store item (needs the CWS_ secrets)'
        type: boolean
        default: false
      publish:
        description: 'Submit the draft for review (it goes out on approval with the visibility the item has in the dashboard)'
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, in the order they started, so two pushes never
# race each other to the store and a lower build never follows a higher
# one. A run that arrives while one waits replaces the waiting one.
concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/release-kit.yml
    with:
      name: claude-swap-cloud
      # The one esbuild the packager minifies with (ESBUILD_VERSION in
      # package.mjs), installed once and named to the packager and its
      # test, so a release is the same bytes CI built.
      setup: npm install -g esbuild@0.25.11
      test: CSWAP_ESBUILD=esbuild node --test "tests/js/extension/*.test.js"
      build: CSWAP_ESBUILD=esbuild node extension/scripts/package.mjs
      zip: extension/.output/claude-swap-cloud-*-chrome.zip
      on-push: ${{ vars.CWS_ON_PUSH }}
      upload: ${{ inputs.upload == true }}
      publish: ${{ inputs.publish == true }}
    # The five store secrets by name, and nothing else of this repository's.
    secrets:
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
