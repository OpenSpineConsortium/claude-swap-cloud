name: Release the extension

# How the extension reaches the Chrome Web Store (docs/store/SUBMISSION.md,
# section 5):
#   a push to main that changes what the zip holds tests the extension,
#     builds the zip as version <manifest>.<commit count> and keeps it as
#     the GitHub release extension-v<that version>, the repository's
#     latest, with the zip and its SHA-256 attached under the versioned
#     name and under the fixed name cswap-import-chrome.zip, so the newest
#     build is always at
#     https://github.com/OpenSpineConsortium/claude-swap/releases/latest/download/cswap-import-chrome.zip
#     (README.md). Then, when the repository variable CWS_ON_PUSH is
#     `upload`, that same zip goes to the store item as its draft; when it
#     is `publish`, the draft is submitted for review too. Unset or `off`,
#     the release is made and nothing goes to the store.
#   a tag extension-v<version> releases the manifest's exact version the
#     same way and uploads it, whatever CWS_ON_PUSH says.
#   Run workflow, with `upload` and/or `publish` ticked, does the same by
#     hand on any branch or tag; with neither ticked it tests and builds,
#     and keeps the zip as the run's artifact only.
# The five CWS_ secrets gate every store call: without them the store step
# says "Not configured" and the run stays green (section 6).

on:
  push:
    branches: [main]
    # What package.mjs puts in the zip, and the two files that shape it.
    paths:
      - 'extension/manifest.json'
      - 'extension/sidepanel.html'
      - 'extension/src/**'
      - 'extension/icons/**'
      - 'extension/scripts/package.mjs'
      - 'PRIVACY.md'
      - '.github/workflows/release.yml'
    tags: ['extension-v*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the zip to the Chrome Web Store item (needs the CWS_ secrets)'
        type: boolean
        default: false
      publish:
        description: 'Submit the draft for review (it goes out on approval with the visibility the item has in the dashboard)'
        type: boolean
        default: false

permissions:
  contents: write

# One release at a time, in the order they started, so two pushes never
# race each other to the store and a lower build never follows a higher
# one. A run that arrives while one waits replaces the waiting one.
concurrency:
  group: chrome-web-store
  cancel-in-progress: false

jobs:
  # Every push to main, tag and manual run builds; what happens to the zip
  # afterwards is decided below.
  package:
    runs-on: ubuntu-latest
    env:
      # The one esbuild the packager minifies with (ESBUILD_VERSION in
      # package.mjs), so a release is the same bytes CI built.
      CSWAP_ESBUILD: esbuild
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: a build from main is numbered by its commit count.
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install esbuild
        run: npm install -g esbuild@0.25.11

      # A tag names the exact version it releases and must match the
      # manifest; a build from a branch is the manifest's version with the
      # commit count as one more integer, so each is above the last.
      - name: Pick the version
        id: version
        shell: bash
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(node -e 'console.log(JSON.parse(require("fs").readFileSync("extension/manifest.json","utf8")).version)')
          build=""
          if [ "${REF#refs/tags/}" != "$REF" ]; then
            if [ "$TAG" != "extension-v$version" ]; then
              echo "The tag $TAG does not match extension/manifest.json ($version): tag extension-v$version instead." >&2
              exit 1
            fi
          else
            build=$(git rev-list --count HEAD)
            version="$version.$build"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "Releasing $version"

      - name: Test the extension
        run: node --test "tests/js/extension/*.test.js"

      # The zip under its versioned name, and the same bytes under the
      # fixed name the README links through the latest release.
      - name: Build the store zip
        shell: bash
        env:
          BUILD: ${{ steps.version.outputs.build }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if [ -n "$BUILD" ]; then node extension/scripts/package.mjs --build "$BUILD"; else node extension/scripts/package.mjs; fi
          cp "extension/.output/cswap-import-$VERSION-chrome.zip" extension/.output/cswap-import-chrome.zip
          (cd extension/.output && sha256sum cswap-import-chrome.zip > cswap-import-chrome.zip.sha256)
          cat extension/.output/*.sha256

      - name: Keep the store zip
        uses: actions/upload-artifact@v4
        with:
          name: cswap-import-chrome
          path: |
            extension/.output/*.zip
            extension/.output/*.zip.sha256
          if-no-files-found: error
          include-hidden-files: true

      # The GitHub release carries the zip and its SHA-256, so the bytes
      # uploaded to the store can be told from any later build, and it is
      # the repository's latest release, so the README's link to
      # releases/latest/download/cswap-import-chrome.zip is this build. A
      # release that exists already (a re-run) gets the files again. A
      # release of the Python package, if one is ever made here, is created
      # with --latest=false so that link keeps pointing at the extension.
      - name: Create the GitHub release
        if: github.event_name == 'push' || inputs.upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="extension-v$VERSION"
          files=(
            "extension/.output/cswap-import-$VERSION-chrome.zip"
            "extension/.output/cswap-import-$VERSION-chrome.zip.sha256"
            extension/.output/cswap-import-chrome.zip
            extension/.output/cswap-import-chrome.zip.sha256
          )
          {
            echo "cswap project import $VERSION for the Chrome Web Store: the package the store step uploads, byte for byte, as cswap-import-$VERSION-chrome.zip and under the fixed name cswap-import-chrome.zip."
            echo
            echo '```'
            cat "extension/.output/cswap-import-$VERSION-chrome.zip.sha256"
            echo '```'
          } > "$RUNNER_TEMP/notes.md"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${files[@]}"
            gh release edit "$tag" --latest
          else
            gh release create "$tag" \
              --target "$TARGET" \
              --latest \
              --title "cswap project import $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --generate-notes \
              "${files[@]}"
          fi

  # The store sees a push to main only when the repository variable asks
  # for it; a tag and a manual run that ticked a box always go.
  store:
    needs: package
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || vars.CWS_ON_PUSH == 'upload' || vars.CWS_ON_PUSH == 'publish')) || inputs.upload || inputs.publish }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Fetch the store zip
        uses: actions/download-artifact@v4
        with:
          name: cswap-import-chrome
          path: extension/.output

      # Upload on every push that reaches here (a branch under the
      # variable, or a tag) and on a manual run that asked for it; submit
      # for review when the variable says publish or the manual run ticked
      # it. Only this step sees the secrets. The step prints the zip's
      # SHA-256, the one in the release.
      - name: Upload to the Chrome Web Store
        shell: bash
        env:
          CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ secrets.CWS_ITEM_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          EVENT: ${{ github.event_name }}
          ON_PUSH: ${{ vars.CWS_ON_PUSH }}
          UPLOAD: ${{ inputs.upload }}
          PUBLISH: ${{ inputs.publish }}
          VERSION: ${{ needs.package.outputs.version }}
        run: |
          set -euo pipefail
          args=(--if-configured)
          if [ "$EVENT" = "push" ] || [ "$UPLOAD" = "true" ]; then args+=(--upload --zip "extension/.output/cswap-import-$VERSION-chrome.zip"); fi
          if { [ "$EVENT" = "push" ] && [ "$ON_PUSH" = "publish" ]; } || [ "$PUBLISH" = "true" ]; then args+=(--publish); fi
          node extension/scripts/publish.mjs "${args[@]}"
